<!--
  Facilities Manager view markup.

  NOT a standalone page - fetched and cloned by facilities-view-renderer.js and
  mounted into the application shell's #view-host. Styling comes from
  facilities-view.css.

  Ported from "Facilities Manager (1a).dc.html": an add/edit form card with
  live cost-index, structure-bonus and rig-effect panels, above a grid of
  configured facility cards.
-->
<template id="facilities-view-template">
<div id="fac-view" class="fac-view">

  <!-- ============================ HEADER ============================ -->
  <div class="fac-head">
    <div class="fac-head-text">
      <h1>Facilities Manager</h1>
      <p class="fac-subtitle">
        Structures and stations available to your industry jobs. Bonuses here
        feed every manufacturing calculation.
      </p>
    </div>
    <div class="fac-head-right">
      <div class="fac-head-actions">
        <button type="button" class="btn btn-secondary" id="fac-import-rav"
                title="Create facilities from a Ravworks config export">
          Import from Ravworks
        </button>
        <button type="button" class="btn btn-secondary" id="fac-import-scan"
                title="Fill the rig slots from an in-game Ship Scanner result">
          Paste Ship Scanner
        </button>
      </div>
      <div class="fac-count">
        <span class="fac-count-value" id="fac-count">0</span>
        <span class="fac-count-label">Facilities</span>
      </div>
    </div>
  </div>

  <!-- Kept outside the modal so a re-render of the preview cannot detach the
       input mid-read. Never visible; the header button clicks it. -->
  <input type="file" id="fac-rav-file" accept=".json,application/json" hidden>

  <div class="fac-scroll qf-scroll">

    <!-- ========================= ADD / EDIT ========================= -->
    <section class="fac-card fac-form-card" id="fac-form-card">
      <div class="fac-card-accent"></div>

      <header class="fac-card-head">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 21V9l7-4v4l7-4v16z"></path>
          <line x1="10" y1="9" x2="10" y2="13"></line>
          <line x1="14" y1="9" x2="14" y2="13"></line>
        </svg>
        <span class="fac-card-title" id="fac-form-title">Add Facility</span>
        <span class="fac-editing-badge" id="fac-editing-badge" hidden>Editing</span>
      </header>

      <form class="fac-form" id="fac-form" novalidate>
        <div class="fac-grid-2">
          <div class="fac-field">
            <label class="fac-label" for="fac-usage-host">Facility Usage</label>
            <div id="fac-usage-host"></div>
          </div>
          <div class="fac-field">
            <label class="fac-label" for="fac-name">Facility Name</label>
            <input type="text" class="qf-input" id="fac-name" placeholder="Enter facility name"
                   autocomplete="off">
          </div>
          <div class="fac-field">
            <label class="fac-label" for="fac-type">Facility Type</label>
            <select class="qf-select" id="fac-type">
              <option value="station">NPC Station</option>
              <option value="structure">Player Structure</option>
            </select>
          </div>
          <div class="fac-field">
            <label class="fac-label" for="fac-region-host">Region</label>
            <div id="fac-region-host"></div>
          </div>
          <div class="fac-field">
            <label class="fac-label" for="fac-system-host">Solar System</label>
            <div id="fac-system-host"></div>
          </div>
          <div class="fac-field" id="fac-structure-field" hidden>
            <label class="fac-label" for="fac-structure">Structure Type</label>
            <!-- A plain select, not QFSearchSelect: five fixed options, and
                 <optgroup> gives the non-selectable category headers for
                 free (binding rule 5). -->
            <select class="qf-select" id="fac-structure"></select>
          </div>
        </div>

        <!-- Structure-only: rigs and owner tax. -->
        <div id="fac-structure-extras" hidden>
          <div class="fac-grid-3">
            <div class="fac-field">
              <label class="fac-label" for="fac-rig1-host">
                Rig Slot 1 <span class="fac-optional">(Optional)</span>
              </label>
              <div id="fac-rig1-host"></div>
            </div>
            <div class="fac-field">
              <label class="fac-label" for="fac-rig2-host">
                Rig Slot 2 <span class="fac-optional">(Optional)</span>
              </label>
              <div id="fac-rig2-host"></div>
            </div>
            <div class="fac-field">
              <label class="fac-label" for="fac-rig3-host">
                Rig Slot 3 <span class="fac-optional">(Optional)</span>
              </label>
              <div id="fac-rig3-host"></div>
            </div>
          </div>

          <div class="fac-grid-2 fac-grid-spaced">
            <div class="fac-field fac-field-narrow">
              <label class="fac-label" for="fac-tax">
                Facility Tax (%) <span class="fac-optional">— set by structure owner</span>
              </label>
              <input type="number" class="qf-input mono" id="fac-tax"
                     min="0" max="100" step="0.01" placeholder="0.00">
            </div>
          </div>
        </div>

        <!-- ---------------------- live info panels ---------------------- -->
        <div class="fac-info" id="fac-info" hidden>

          <div class="fac-panel" id="fac-cost-panel" hidden>
            <div class="fac-panel-title">System Cost Indices</div>
            <div class="fac-index-grid" id="fac-cost-indices"></div>
          </div>

          <div class="fac-panel" id="fac-bonus-panel" hidden>
            <div class="fac-panel-title">
              Structure Bonuses
              <span class="fac-panel-note" id="fac-structure-name"></span>
            </div>
            <div class="fac-bonus-grid" id="fac-bonuses"></div>
          </div>

          <div class="fac-panel" id="fac-rig-panel" hidden>
            <div class="fac-panel-title">Rig Effects</div>
            <div class="fac-rig-list" id="fac-rig-effects"></div>
          </div>

        </div>

        <footer class="fac-form-actions">
          <button type="button" class="btn btn-secondary" id="fac-clear">Clear</button>
          <button type="submit" class="btn btn-primary" id="fac-submit">Add Facility</button>
        </footer>
      </form>
    </section>

    <!-- ======================= CONFIGURED LIST ======================= -->
    <section class="fac-list-section">
      <header class="fac-list-head">
        <h2>Manufacturing Facilities</h2>
        <span class="fac-list-count" id="fac-list-count">0</span>
      </header>

      <div class="fac-card-grid" id="fac-list"></div>
    </section>

  </div>

  <!-- ========================= REMOVE FACILITY ======================== -->
  <div id="fac-delete-modal" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="fac-delete-title" hidden>
    <div class="modal-content fac-confirm-modal">
      <div class="modal-header">
        <h2 id="fac-delete-title">Remove Facility</h2>
        <button type="button" class="modal-close" id="fac-delete-close"
                aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">
        <p id="fac-delete-text" class="fac-confirm-text"></p>
        <p class="fac-confirm-note">
          Manufacturing plans that already reference this facility keep the
          copy of its bonuses they were built with.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" id="fac-delete-cancel">Cancel</button>
        <button type="button" class="btn btn-danger btn-sm" id="fac-delete-ok">Remove</button>
      </div>
    </div>
  </div>

  <!-- ====================== SHIP SCANNER IMPORT ====================== -->
  <div id="fac-scan-modal" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="fac-scan-title" hidden>
    <div class="modal-content fac-scan-modal">
      <div class="modal-header">
        <h2 id="fac-scan-title">Paste Ship Scanner Result</h2>
        <button type="button" class="modal-close" id="fac-scan-close"
                aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">
        <p class="fac-scan-hint">
          Fills the rig slots on the form above. The scan does not carry a name,
          system or structure type &mdash; set those yourself before saving.
        </p>
        <textarea id="fac-scan-input" class="qf-input fac-scan-textarea" rows="12"
                  placeholder="High Power Slots&#10;...&#10;Rig Slots&#10;Standup M-Set ..."
                  autocomplete="off" spellcheck="false"></textarea>
        <div id="fac-scan-summary" class="fac-scan-summary" hidden></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="fac-scan-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="fac-scan-apply">Apply Rigs</button>
      </div>
    </div>
  </div>

  <!-- ======================== RAVWORKS IMPORT ======================== -->
  <div id="fac-rav-modal" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="fac-rav-title" hidden>
    <div class="modal-content fac-rav-modal">
      <div class="modal-header">
        <h2 id="fac-rav-title">Import from Ravworks</h2>
        <button type="button" class="modal-close" id="fac-rav-close"
                aria-label="Close dialog">&times;</button>
      </div>
      <div class="modal-body">
        <p class="fac-rav-hint">
          Ravworks does not record what each structure is used for, so pick a
          usage per row. Rows with a problem cannot be selected until it is fixed.
        </p>
        <div class="fac-rav-table-wrap qf-scroll">
          <table class="fac-rav-table">
            <thead>
              <tr>
                <th class="fac-rav-col-check">
                  <input type="checkbox" id="fac-rav-all" aria-label="Select all importable rows">
                </th>
                <th>Name</th>
                <th>Structure</th>
                <th>Solar System</th>
                <th>Usage</th>
                <th>Rigs</th>
              </tr>
            </thead>
            <tbody id="fac-rav-rows"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="fac-rav-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="fac-rav-confirm">Import</button>
      </div>
    </div>
  </div>

</div>
</template>
