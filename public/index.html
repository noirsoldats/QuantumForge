<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.evetech.net; frame-src 'self'">
  <title>Quantum Forge - Eve Online Industry Manager</title>
  <link rel="stylesheet" href="shared/variables.css">
  <link rel="stylesheet" href="shared/components.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="dashboard.css">
  <!-- Views mounted into the shell bring no stylesheet of their own, so every
       view's CSS is loaded here. Add one line per ported screen. -->
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="character-hub.css">
  <link rel="stylesheet" href="market-view.css">
  <link rel="stylesheet" href="blueprint-calculator-view.css">
  <link rel="stylesheet" href="manufacturing-plans-view.css">
  <link rel="stylesheet" href="facilities-view.css">
  <link rel="stylesheet" href="reactions-view.css">
  <link rel="stylesheet" href="assets-view.css">
  <link rel="stylesheet" href="skills-view.css">
  <link rel="stylesheet" href="blueprints-view.css">
  <link rel="stylesheet" href="manufacturing-summary-view.css">
  <link rel="stylesheet" href="loot-analyzer-view.css">
  <link rel="stylesheet" href="what-can-i-build-view.css">
  <link rel="stylesheet" href="esi-status-view.css">
  <link rel="stylesheet" href="audit-log-view.css">
</head>
<body>
  <!--
    The application shell (title bar + activity rail + footer) is built by
    shared/shell.js in the `main` role. The dashboard below is mounted into the
    shell's #view-host as the default view by renderer.js.

    The 8 `*-card` ids, the character-menu ids and the SDE modal ids are part of
    the renderer.js contract - do not rename them.
  -->
  <div id="dashboard-view">
    <div class="dash-inner">

      <!-- Greeting -->
      <div class="dash-greeting">
        <div>
          <h1 id="dash-welcome">Welcome to Quantum Forge</h1>
          <p id="dash-subtitle">Your industry operations at a glance.</p>
        </div>
        <!-- Refreshes character/corp ledger data (industry jobs, wallet
             transactions, wallet journal). Market data is refreshed separately
             from the Market Data Age tile, which has its own progress. -->
        <button class="secondary-button" id="dash-refresh-all" title="Refresh industry jobs, wallet transactions and journal for all characters">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          </svg>
          <span class="btn-label">Refresh Industry Data</span>
        </button>
      </div>

      <!-- Status tiles -->
      <div class="dash-tiles">

        <!-- Market data age -->
        <div class="dash-tile" id="tile-market">
          <div class="dash-tile-bar"></div>
          <div class="dash-tile-body">
            <div class="dash-tile-head">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3v18h18"></path>
                <path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14"></path>
              </svg>
              <span>Market Data Age</span>
            </div>
            <div class="dash-tile-value" id="tile-market-age">--</div>
            <div class="dash-tile-foot">
              <span id="tile-market-detail">No market data</span>
              <button class="dash-tile-action" id="tile-market-refresh">Refresh</button>
            </div>
            <!-- Shown only while a market refresh is running. -->
            <div class="dash-tile-progress" id="tile-market-progress" hidden>
              <div class="dash-progress-track">
                <div class="dash-progress-fill" id="tile-market-progress-fill"></div>
              </div>
              <span class="dash-progress-label" id="tile-market-progress-label">Starting…</span>
            </div>
          </div>
        </div>

        <!-- ESI health -->
        <div class="dash-tile" id="tile-esi">
          <div class="dash-tile-bar"></div>
          <div class="dash-tile-body">
            <div class="dash-tile-head">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
              </svg>
              <span>ESI Health</span>
            </div>
            <div class="dash-tile-status">
              <span class="dash-pulse" id="tile-esi-dot"></span>
              <span class="dash-tile-status-label" id="tile-esi-status">Checking</span>
            </div>
            <div class="dash-endpoints" id="tile-esi-endpoints"></div>
          </div>
        </div>

        <!-- Active plans -->
        <div class="dash-tile" id="tile-plans">
          <div class="dash-tile-bar"></div>
          <div class="dash-tile-body">
            <div class="dash-tile-head">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="6" y="4" width="12" height="17" rx="2"></rect>
                <path d="M9 11l2 2 4-4"></path>
              </svg>
              <span>Active Plans</span>
            </div>
            <div class="dash-tile-value" id="tile-plans-count">--</div>
            <div class="dash-tile-note" id="tile-plans-note"></div>
          </div>
        </div>

        <!-- Server -->
        <div class="dash-tile" id="tile-server">
          <div class="dash-tile-bar"></div>
          <div class="dash-tile-body">
            <div class="dash-tile-head">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="3" width="20" height="6" rx="1"></rect>
                <rect x="2" y="15" width="20" height="6" rx="1"></rect>
                <line x1="6" y1="6" x2="6.01" y2="6"></line>
                <line x1="6" y1="18" x2="6.01" y2="18"></line>
              </svg>
              <span>Tranquility</span>
            </div>
            <div class="dash-tile-status">
              <span class="dash-pulse" id="tile-server-dot"></span>
              <span class="dash-tile-status-label" id="tile-server-status">Checking</span>
            </div>
            <div class="dash-tile-note" id="tile-server-note"></div>
          </div>
        </div>
      </div>

      <!-- Tools -->
      <div class="dash-tools-section">
        <h2 class="dash-section-title">Tools</h2>
        <div class="dash-tools" id="dash-tools">
          <!-- Cards are rendered by renderer.js so their stat lines can carry
               live data. Card ids are part of the renderer contract. -->
        </div>
      </div>

    </div>
  </div>

  <!--
    No SDE update modal. It could only be raised by `sde:update-available`,
    which nothing ever sent. Updates surface at startup (the splash) or when
    the user checks in Settings; the app does not poll while running.
  -->

  <!--
    Character avatar stack, docked into the title bar by renderer.js.

    One avatar per connected character (default first, gold ring); each opens
    its own menu. Both the stack and the menus are built by renderer.js, since
    the character list is dynamic.
  -->
  <div id="character-avatar-container" class="character-avatar-container" style="display: none;">
    <div id="character-avatar-stack" class="character-avatar-stack"></div>
  </div>

  <!-- Legacy settings button; the shell rail owns navigation now, but
       renderer.js still binds this id. Hidden via CSS. -->
  <button id="settings-btn" class="settings-icon" title="Settings" aria-label="Open Settings" hidden></button>

  <!-- Settings ships as a native shell view: its template is injected here and
       settings-renderer.js registers it with the router. -->
  <script src="shared/ui-helpers.js"></script>
  <script src="shared/toast.js"></script>
  <script src="shared/qf-search-select.js"></script>
  <script src="shared/freshness.js"></script>
  <script src="shared/shell.js"></script>
  <script src="shared/scope-error.js"></script>
  <script src="../src/renderer/footer-utils.js"></script>
  <script src="shared/footer.js"></script>
  <script src="../src/renderer/renderer.js"></script>
  <script src="../src/renderer/settings-renderer.js"></script>
  <script src="../src/renderer/character-hub-renderer.js"></script>
  <script src="../src/renderer/market-view-renderer.js"></script>
  <script src="../src/renderer/blueprint-calculator-view-renderer.js"></script>
  <script src="../src/renderer/manufacturing-plans-view-renderer.js"></script>
  <script src="../src/renderer/facilities-view-renderer.js"></script>
  <script src="../src/renderer/reactions-view-renderer.js"></script>
  <script src="../src/renderer/assets-view-renderer.js"></script>
  <script src="../src/renderer/skills-view-renderer.js"></script>
  <script src="../src/renderer/blueprints-view-renderer.js"></script>
  <script src="../src/renderer/manufacturing-summary-view-renderer.js"></script>
  <script src="../src/renderer/loot-analyzer-view-renderer.js"></script>
  <script src="../src/renderer/what-can-i-build-view-renderer.js"></script>
  <script src="../src/renderer/esi-status-view-renderer.js"></script>
  <script src="../src/renderer/audit-log-view-renderer.js"></script>
</body>
</html>
